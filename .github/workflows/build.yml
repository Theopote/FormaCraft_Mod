name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: build
        run: ./gradlew build
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Java package boundaries
        run: |
          python scripts/test_check_architecture.py
          python scripts/check_architecture.py
          python scripts/check_generation_entrypoints.py
      - name: python backend smoke
        run: |
          pip install -r python_backend/requirements-test.lock
          python python_backend/tools/spec_contract_smoke.py
      - name: all python backend tests
        working-directory: python_backend
        run: python -m pytest tests -q --junitxml=../build/test-results/python/pytest.xml
      - name: eval quality gate
        working-directory: python_backend
        # The full pytest suite above includes the curated unittest modules.
        run: python -m eval.ci_gate --quick
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: capture verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Verification-reports
          path: |
            build/reports/
            build/test-results/
